<nav class="navbar navbar-light site-navbar fixed-top mb-5">
    <div class="container-lg position-relative d-flex align-items-center justify-content-end flex-nowrap">
        <span class="navbar-brand">{{ site.data.profile.navbar_name }}</span>
        <div class="site-navigation mr-auto{% if page.navbar_title == 'Publications' %} is-publication-active{% endif %}">
            <span class="page-nav-indicator" aria-hidden="true"></span>
            <ul class="navbar-nav">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}" data-page-nav="{{ item.name | downcase }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}>
                        {% if item.icon == "book-half" %}
                        <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                            <path fill="currentColor" d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
                        </svg>
                        {% else %}
                        <i class="{{ item.icon }} nav-icon" aria-hidden="true"></i>
                        {% endif %}
                        <span class="nav-label">{{ item.name }}</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
        <div class="theme-toggle-item">
            <div class="theme-switch" role="group" aria-label="Color theme">
                <button class="theme-option" type="button" data-theme-value="light" aria-label="Light mode" title="Light mode" aria-pressed="false">
                    <svg class="theme-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
                    </svg>
                </button>
                <button class="theme-option" type="button" data-theme-value="dark" aria-label="Dark mode" title="Dark mode" aria-pressed="false">
                    <i class="fas fa-moon theme-icon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</nav>
