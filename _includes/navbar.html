<nav class="navbar navbar-expand-sm navbar-light glass-navbar fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %} position-relative d-flex align-items-center justify-content-center" style="height: 3.5rem;">
        <a class="navbar-brand">{{site.data.profile.navbar_name}}</a>
        <button class="navbar-toggler" style="border: none;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <div class="two-bars">
                <span></span>
                <span></span>
            </div>
        </button>

        <div class="collapse navbar-collapse position-absolute-sm" id="navbarResponsive" style="right: 1rem;">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
