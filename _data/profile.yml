short_bio: >-
  <p>
    I am a Ph.D. student in Data Science at <a href="https://gsds.snu.ac.kr/" target="_blank">Seoul National University</a>,
    advised by <a href="https://joonseoklee.com/" target="_blank">Prof. Joonseok Lee</a> at the
    <a href="https://viplab.snu.ac.kr/" target="_blank">Vision Information Processing Lab (VIPLab)</a>.
  </p>
  <p>
    My research interests include <strong>Recommendation Systems</strong>, <strong>Graph Representation Learning</strong>,
    and <strong>Neural Differential Equations</strong>. I am broadly interested in developing scalable and
    principled machine learning methods for structured data.
  </p>

