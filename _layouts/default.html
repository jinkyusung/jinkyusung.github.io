<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% if page.navbar_title == "Home" %}
    <title>{{ site.data.profile.navbar_name }}</title>
    {% else %}
    <title>{{ site.data.profile.navbar_name }} - {{ page.title }}</title>
    {% endif %}
    {% if page.navbar_title == "Publications" %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon_book_half.svg' | relative_url }}">
    {% else %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon_profile.svg' | relative_url }}?v=4">
    {% endif %}

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&amp;display=swap" rel="stylesheet">
    <script>
        (function () {
            var theme = 'light';
            try {
                var savedTheme = localStorage.getItem('site-theme');
                theme = savedTheme === 'light' || savedTheme === 'dark'
                    ? savedTheme
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (error) {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
        }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light">
    {% include navbar.html %}
    <main class="container pb-5">
        {{content}}
    </main>
    {% include footer.html %}

    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
</body>
</html>
